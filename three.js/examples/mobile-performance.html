<!DOCTYPE html>
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<!-- three.js library -->
<script src='vendor/three.js/build/three.min.js'></script>
<script src="vendor/three.js/examples/js/libs/stats.min.js"></script>
<!-- ar.js -->
<script src="../build/ar.js"></script>
<script>THREEx.ArToolkitContext.baseURL = '../'</script>

<body style='margin : 0px; overflow: hidden; font-family: Monospace;'><div style='position: absolute; top: 10px; width:100%; text-align: center; z-index: 1;'>
	<a href="https://github.com/jeromeetienne/AR.js/" target="_blank">AR.js</a> - three.js mobile performance
	<br/>
	Contact me any time at <a href='https://twitter.com/jerome_etienne' target='_blank'>@jerome_etienne</a>
</div><script>
	//////////////////////////////////////////////////////////////////////////////////
	//		Init
	//////////////////////////////////////////////////////////////////////////////////

	class Vertex {
		constructor(p) {
			this.p = p;
			this.normal = [];
			this.triangles = [];
		}
	}

	class Triangle {
		constructor(v0, v1, v2) {
			this.v0 = v0;
			this.v1 = v1;
			this.v2 = v2;
			this.normal = [];
			this.tangent = [];
		}
	}

	// init renderer
	var renderer	= new THREE.WebGLRenderer({
		// antialias	: true,
		alpha: true
	});
	renderer.setClearColor(new THREE.Color('lightgrey'), 0)
	// renderer.setPixelRatio( 1/2 );
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.domElement.style.position = 'absolute'
	renderer.domElement.style.top = '0px'
	renderer.domElement.style.left = '0px'
	document.body.appendChild( renderer.domElement );

	// array of functions for the rendering loop
	var onRenderFcts= [];

	// init scene and camera
	var scene	= new THREE.Scene();


	// Add lighting so the green color is visible
	var light = new THREE.DirectionalLight(0xffffff, 1);
	light.position.set(1, 1, 1).normalize();
	scene.add(light);

	var ambientLight = new THREE.AmbientLight(0x404040); // soft white ambient light
	scene.add(ambientLight);
	//////////////////////////////////////////////////////////////////////////////////
	//		Initialize a basic camera
	//////////////////////////////////////////////////////////////////////////////////

	// Create a camera
	var camera = new THREE.Camera();
	scene.add(camera);

	////////////////////////////////////////////////////////////////////////////////
	//          handle arToolkitSource
	////////////////////////////////////////////////////////////////////////////////

	var arToolkitSource = new THREEx.ArToolkitSource({
		// to read from the webcam
		sourceType : 'webcam',

		// to read from an image
		// sourceType : 'image',
		// sourceUrl : THREEx.ArToolkitContext.baseURL + '../data/images/img.jpg',

		// to read from a video
		// sourceType : 'video',
		// sourceUrl : THREEx.ArToolkitContext.baseURL + '../data/videos/headtracking.mp4',
	})

	arToolkitSource.init(function onReady(){
		onResize()
	})

	// handle resize
	window.addEventListener('resize', function(){
		onResize()
	})
	function onResize(){
		arToolkitSource.onResizeElement()
		arToolkitSource.copyElementSizeTo(renderer.domElement)
		if( arToolkitContext.arController !== null ){
			arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas)
		}
	}
	////////////////////////////////////////////////////////////////////////////////
	//          initialize arToolkitContext
	////////////////////////////////////////////////////////////////////////////////


	// create atToolkitContext
	var arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl: THREEx.ArToolkitContext.baseURL + '../data/data/camera_para.dat',
		detectionMode: 'mono',
		maxDetectionRate: 30,
		canvasWidth: 80*3,
		canvasHeight: 60*3,
	})
	// initialize it
	arToolkitContext.init(function onCompleted(){
		// copy projection matrix to camera
		camera.projectionMatrix.copy( arToolkitContext.getProjectionMatrix() );
	})

	// update artoolkit on every frame
	onRenderFcts.push(function(){
		if( arToolkitSource.ready === false )	return

		arToolkitContext.update( arToolkitSource.domElement )
	})


	////////////////////////////////////////////////////////////////////////////////
	//          Create a ArMarkerControls
	////////////////////////////////////////////////////////////////////////////////

	var markerRoot = new THREE.Group
	scene.add(markerRoot)
	var artoolkitMarker = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
		type : 'pattern',
		patternUrl : THREEx.ArToolkitContext.baseURL + '../data/data/patt.hiro'
		// patternUrl : THREEx.ArToolkitContext.baseURL + '../data/data/patt.kanji'
	})

	// build a smoothedControls
	var smoothedRoot = new THREE.Group()
	scene.add(smoothedRoot)
	var smoothedControls = new THREEx.ArSmoothedControls(smoothedRoot, {
		lerpPosition: 0.4,
		lerpQuaternion: 0.3,
		lerpScale: 1,
	})
	onRenderFcts.push(function(delta){
		smoothedControls.update(markerRoot)
	})
	//////////////////////////////////////////////////////////////////////////////////
	//		add an object in the scene
	//////////////////////////////////////////////////////////////////////////////////

	var arWorldRoot = smoothedRoot

	// add a custom surface

	var geometry	= this.generateBufferGeometry();
	var material	= new THREE.MeshStandardMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
	var mesh	= new THREE.Mesh( geometry, material );
	mesh.position.y	= 0.5;
	mesh.rotation.x = 1.25;
	arWorldRoot.add( mesh );

	onRenderFcts.push(function(){
		mesh.rotation.x += 0.01;
	})

	//////////////////////////////////////////////////////////////////////////////////
	//		render the whole thing on the page
	//////////////////////////////////////////////////////////////////////////////////
	var stats = new Stats();
	document.body.appendChild( stats.dom );
	// render the scene
	onRenderFcts.push(function(){
		renderer.render( scene, camera );
		stats.update();
	})

	// run the rendering loop
	var lastTimeMsec= null
	requestAnimationFrame(function animate(nowMsec){
		// keep looping
		requestAnimationFrame( animate );
		// measure time
		lastTimeMsec	= lastTimeMsec || nowMsec-1000/60
		var deltaMsec	= Math.min(200, nowMsec - lastTimeMsec)
		lastTimeMsec	= nowMsec
		// call each update function
		onRenderFcts.forEach(function(onRenderFct){
			onRenderFct(deltaMsec/1000, nowMsec/1000)
		})
	})

	function generateBufferGeometry() {
		const geometry = new THREE.BufferGeometry();
		const data = {};
		
		this.createSurfaceData(data);

		// Define the vertex positions
		const vertices = data.verticesF32;

		// Set the position attribute
		geometry.addAttribute('position', new THREE.BufferAttribute(vertices, 3));

		// Define the indices for faces (if not sequential)
		const indices = data.indicesU16;
		geometry.setIndex(new THREE.BufferAttribute(indices, 1));

		return geometry;
	}

	function createSurfaceData(data) {
        let vertices = [];
        let triangles = [];

        let a = 1.0;
        let c = 0.5;
        let theta = Math.PI / 6;

        let numU = 72;
        let numT = 10;
        let tMin = -1, tMax = 1;

        for (let i = 0; i < numT; i++) {
            let t = tMin + (tMax - tMin) * (i / (numT - 1));
            for (let j = 0; j < numU; j++) {
                let u = (j / numU) * 2 * Math.PI;
                let r = a + t * Math.cos(theta) + c * t * t * Math.sin(theta);
                let x = r * Math.cos(u);
                let y = r * Math.sin(u);
                let z = -t * Math.sin(theta) + c * t * t * Math.cos(theta);
                vertices.push(new Vertex([x, y, z]));
            }
        }

        for (let i = 0; i < numT - 1; i++) {
            for (let j = 0; j < numU; j++) {
                let v0 = i * numU + j;
                let v1 = i * numU + (j + 1) % numU;
                let v2 = (i + 1) * numU + j;
                let v3 = (i + 1) * numU + (j + 1) % numU;

                triangles.push(new Triangle(v0, v1, v2));
                triangles.push(new Triangle(v1, v3, v2));
            }
        }

        this.generateVerticesAndIndicesArrays(vertices, triangles, data);
    }

	function generateVerticesAndIndicesArrays(vertices, triangles, data) {
        data.verticesF32 = new Float32Array(vertices.length * 3);
        for (let i = 0; i < vertices.length; i++) {
            data.verticesF32[i * 3 + 0] = vertices[i].p[0];
            data.verticesF32[i * 3 + 1] = vertices[i].p[1];
            data.verticesF32[i * 3 + 2] = vertices[i].p[2];
        }

        data.indicesU16 = new Uint16Array(triangles.length * 3);
        for (let i = 0; i < triangles.length; i++) {
            data.indicesU16[i * 3 + 0] = triangles[i].v0;
            data.indicesU16[i * 3 + 1] = triangles[i].v1;
            data.indicesU16[i * 3 + 2] = triangles[i].v2;
        }

        return data;
    }
</script></body>
